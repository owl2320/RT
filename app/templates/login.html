<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>


<body>

    <div class="auth-container">

        <h1>Login</h1>


        <form id="login-form">

            <input
                id="login-email"
                type="email"
                placeholder="Email"
                required
            >


            <input
                id="login-password"
                type="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="error-message"></p>


        <p>
            Don't have an account?
            <a href="/signup">
                Signup
            </a>
        </p>

    </div>


    <script src="/static/js/auth.js"></script>

</body>

</html>
